---
layout: default
---

<header class="site-mark">
  <h1>
    {{ site.description | strip | replace: ".", "" }}<span class="drift-dot">.</span>
  </h1>
</header>

<!-- {%-include menu_item.html collection=site.data.menu.entries-%} -->

<nav class="site-nav">
  {% if site.posts.size > 0 %}
  <p class="site-posts">
    {% for post in site.posts %}
    <a href="{{ post.url | relative_url }}">{{ post.date | date: site.theme_config.date_format }}</a>
    {% endfor %}
  </p>
  {% endif %}
  <div class="site-nav-row">
    {{ content }}
    <span class="site-copy">© {{ 'now' | date: '%Y' }}</span>
  </div>
</nav>

<script>
  (function () {
    var seps = "ふくざつけい";
    var row = document.querySelector(".site-nav-row");
    if (!row) return;

    var targets = Array.prototype.slice.call(row.querySelectorAll("li")).slice(1);
    var copy = row.querySelector(".site-copy");
    if (copy) targets.push(copy);

    targets.forEach(function (el, i) {
      el.style.setProperty("--sep", '"' + seps[i % seps.length] + '"');
    });
  })();
</script>
